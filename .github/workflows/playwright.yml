name: CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint, format & types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # Request-only: no browser download needed.
      - run: npx playwright test --project=api

  e2e:
    name: E2E tests (Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history so --only-changed can diff against the PR base ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      # Fail-fast heuristic: run only what this PR changed, so a broken changed
      # test fails the job before the full suite starts. Never the only run —
      # the full suite always follows (it also covers source-code changes that
      # --only-changed cannot map to tests).
      - name: 'Fail-fast: tests changed in this PR'
        if: ${{ github.event_name == 'pull_request' }}
        run: npx playwright test --only-changed=origin/${{ github.base_ref }} --pass-with-no-tests
      - run: npx playwright test --project=firefox --project=firefox-anon
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: playwright-report/
          overwrite: true
          retention-days: 14
      - name: Upload failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload machine-readable results (JUnit + JSON)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-results-${{ github.run_attempt }}
          path: |
            junit.xml
            results.json
          if-no-files-found: warn
          retention-days: 14

  e2e-flaky:
    # Quarantined @flaky tests: excluded from the required jobs above (per-project
    # filter in playwright.config.ts) and run here, separately, non-blocking.
    # See CI-CD-PLAN.md, Phase 3 "Flake tracking" for the quarantine policy.
    name: E2E quarantined tests (non-blocking)
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      PLAYWRIGHT_QUARANTINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      # Zero quarantined tests today -> an empty selection still passes.
      - run: npx playwright test --project=firefox --project=firefox-anon --pass-with-no-tests
      - name: Upload machine-readable results (JUnit + JSON)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-flaky-results-${{ github.run_attempt }}
          path: |
            junit.xml
            results.json
          if-no-files-found: warn
          retention-days: 14

  pages:
    name: Publish report
    if: ${{ github.ref == 'refs/heads/master' }}
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: playwright-report
          path: playwright-report
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: playwright-report
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
