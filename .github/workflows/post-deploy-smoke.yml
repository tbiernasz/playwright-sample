# Post-deploy smoke (Phase 3): run the @smoke subset against a freshly deployed
# URL. Triggered by a successful deployment (e.g. the Pages deployment created by
# the `pages` job in playwright.yml).
#
# PLAYWRIGHT_TEST_BASE_URL makes playwright.config.ts skip its webServer and point
# the browser at the deployment; PLAYWRIGHT_SMOKE selects @smoke tests per-project
# (setup stays unfiltered on purpose - a dependency project with zero matching
# tests would make Playwright skip its dependents).
name: Post-deploy smoke

on:
  deployment_status:
    types: [success]

permissions:
  contents: read

concurrency:
  group: post-deploy-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke against deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_TEST_BASE_URL: ${{ github.event.deployment_status.target_url }}
      PLAYWRIGHT_SMOKE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - run: npx playwright test --project=firefox --project=firefox-anon --pass-with-no-tests
